name: Build Collage Frankenstein Docker Image

on:
  push:
    branches: [main]
    paths:
      - collage_frankenstein_bot.py
      - collage_frankenstein_run.py
      - Dockerfile.collage-frankenstein
      - stencil_transform.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.collage-frankenstein
          push: true
          tags: ghcr.io/a-u-supply/collage-frankenstein:latest
