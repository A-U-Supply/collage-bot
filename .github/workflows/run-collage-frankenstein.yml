name: Run Collage Frankenstein Bot

on:
  workflow_dispatch:
    inputs:
      source_channel:
        description: 'Channel to fetch images from'
        default: 'image-gen'
      post_channel:
        description: 'Channel to post results to'
        default: 'img-junkyard'
      size:
        description: 'Square pixel dimension to standardize source images to'
        default: '900'
      quilt:
        description: 'Apply image-quilting seam cuts'
        type: boolean
        default: true
      warp:
        description: 'Apply geometric warp at tile boundaries'
        type: boolean
        default: false
      warp_depth:
        description: 'Pixels from boundary to warp inward'
        default: '80'
      warp_radius:
        description: 'Per-row shift search radius (pixels)'
        default: '30'
      warp_scale:
        description: 'Shift amplification multiplier (>1 exaggerates warp)'
        default: '1.0'
      warp_strip:
        description: 'Border strip width (px) used to match forms for shift computation'
        default: '20'
      stencil:
        description: 'Convert source images to binary black & white before slicing'
        type: boolean
        default: false
      anneal:
        description: 'Run simulated annealing after greedy placement to refine tile arrangement'
        type: boolean
        default: false
      anneal_steps:
        description: 'Number of SA swap attempts per output'
        default: '500'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collage frankenstein bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python collage_frankenstein_bot.py \
            --source-channel "${{ inputs.source_channel }}" \
            --post-channel "${{ inputs.post_channel }}" \
            --size "${{ inputs.size }}" \
            ${{ inputs.quilt == false && '--no-quilt' || '' }} \
            ${{ inputs.warp && '--warp' || '' }} \
            --warp-depth "${{ inputs.warp_depth }}" \
            --warp-radius "${{ inputs.warp_radius }}" \
            --warp-scale "${{ inputs.warp_scale }}" \
            --warp-strip "${{ inputs.warp_strip }}" \
            ${{ inputs.stencil && '--stencil' || '' }} \
            ${{ inputs.anneal && '--anneal' || '' }} \
            --anneal-steps "${{ inputs.anneal_steps }}"
