name: Run Collage Frankenstein Bot

on:
  workflow_dispatch:
    inputs:
      from_channel:
        description: 'Channel to fetch images from'
        default: 'image-gen'
      to_channel:
        description: 'Channel to post results to'
        default: 'img-junkyard'
      resolution:
        description: 'Square pixel dimension to standardize source images to'
        default: '900'
      style:
        description: 'Visual style applied to source images before slicing'
        type: choice
        default: 'color'
        options:
          - color
          - rgb
          - grayscale
          - stencil
          - sobel
          - canny
          - invert
          - posterize
          - solarize
      seams:
        description: 'Seam cutting mode at tile boundaries'
        type: choice
        default: 'edge'
        options:
          - edge
          - smooth
          - off
      warp:
        description: 'Apply geometric warp at tile boundaries'
        type: boolean
        default: false
      warp_depth:
        description: 'Pixels from boundary to warp inward'
        default: '80'
      warp_radius:
        description: 'Per-row shift search radius (pixels)'
        default: '30'
      warp_scale:
        description: 'Shift amplification multiplier (>1 exaggerates warp)'
        default: '1.0'
      warp_strip:
        description: 'Border strip width (px) used to match forms for shift computation'
        default: '20'
      refine:
        description: 'Run simulated annealing after greedy placement to refine tile arrangement'
        type: boolean
        default: false
      refine_steps:
        description: 'Number of SA swap attempts per output'
        default: '500'
      animate:
        description: 'Generate an animated GIF alongside the 9 still outputs'
        type: boolean
        default: false
      animate_mode:
        description: 'dissolve: cross-fade outputs 1↔9; slide: tiles shift positions; both: one of each'
        type: choice
        default: 'dissolve'
        options:
          - dissolve
          - slide
          - both
      animate_frames:
        description: 'Number of frames in each direction of the morph animation'
        default: '12'
      animate_speed:
        description: 'Milliseconds per frame in the morph GIF'
        default: '150'
      layout:
        description: 'Grid layout style'
        type: choice
        default: 'grid'
        options:
          - grid
          - mondrian
      regions:
        description: 'Number of regions in each Mondrian partition (1–9)'
        default: '9'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collage frankenstein bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python collage_frankenstein_bot.py \
            --source-channel "${{ inputs.from_channel }}" \
            --post-channel "${{ inputs.to_channel }}" \
            --size "${{ inputs.resolution }}" \
            --style "${{ inputs.style }}" \
            --seams "${{ inputs.seams }}" \
            ${{ inputs.warp && '--warp' || '' }} \
            --warp-depth "${{ inputs.warp_depth }}" \
            --warp-radius "${{ inputs.warp_radius }}" \
            --warp-scale "${{ inputs.warp_scale }}" \
            --warp-strip "${{ inputs.warp_strip }}" \
            ${{ inputs.refine && '--anneal' || '' }} \
            --anneal-steps "${{ inputs.refine_steps }}" \
            ${{ inputs.animate && '--morph' || '' }} \
            --morph-mode "${{ inputs.animate_mode }}" \
            --morph-frames "${{ inputs.animate_frames }}" \
            --morph-delay "${{ inputs.animate_speed }}" \
            ${{ inputs.layout == 'mondrian' && '--mondrian' || '' }} \
            --mondrian-regions "${{ inputs.regions }}"
